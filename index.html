<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bajando mi handicap</title>
<meta name="theme-color" content="#1D5B40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi handicap">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --surface2:#E2EAE0; --ink:#12241B; --ink2:#51645A; --line:#C7D3C9;
  --green:#1D5B40; --on-green:#FFFFFF; --green-soft:#D5E6DB;
  --flag:#F2C230; --on-flag:#2A2203; --orange:#C25E0A; --gold:#D4A62A; --on-gold:#2A2203; --red:#B3312A; --water:#2A6F97; --on-red:#FFFFFF;
  --display:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1713; --surface:#16231C; --surface2:#1F3027; --ink:#E7EFE9; --ink2:#9DB0A4; --line:#2E4337;
    --green:#49A77A; --on-green:#06110B; --green-soft:#1D3A2C;
    --flag:#F2C230; --on-flag:#2A2203; --orange:#F2A04E; --gold:#E3B946; --on-gold:#2A2203; --red:#EC7067; --water:#62AEDA; --on-red:#1E0706;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1713; --surface:#16231C; --surface2:#1F3027; --ink:#E7EFE9; --ink2:#9DB0A4; --line:#2E4337;
  --green:#49A77A; --on-green:#06110B; --green-soft:#1D3A2C;
  --flag:#F2C230; --on-flag:#2A2203; --orange:#F2A04E; --gold:#E3B946; --on-gold:#2A2203; --red:#EC7067; --water:#62AEDA; --on-red:#1E0706;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.1}
h1{font-size:34px;letter-spacing:.2px}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
.muted{color:var(--ink2)}
.small{font-size:14px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

#app{max-width:560px;margin:0 auto;padding:18px 16px 110px}
#app.inround{padding-bottom:190px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.top .sub{color:var(--ink2);font-size:14px;margin-top:2px}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:14px}
.bar h1{font-size:19px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar > :first-child{justify-self:start}
.bar > :last-child{justify-self:end}
.link{background:none;border:0;padding:8px 2px;color:var(--green);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.block > h2{margin-bottom:10px}
.block > h3{margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack > * + *{margin-top:10px}

.btn{border:1.5px solid var(--green);background:transparent;color:var(--green);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.flag{background:var(--flag);border-color:var(--flag);color:var(--on-flag)}
.btn.big{width:100%;font-family:var(--display);font-size:24px;padding:16px;letter-spacing:.3px}
.btn.quiet{border-color:var(--line);color:var(--ink)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:600}
.chip.bad[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.chip.pen[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:var(--on-red)}
.chips.four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chips.four .chip{padding:10px 2px;font-size:15px;text-align:center}

input[type=number],input[type=text],input[type=date]{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input.narrow{width:84px;text-align:center}
label.f{display:block;font-size:14px;color:var(--ink2);margin-bottom:4px}

/* hole strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.hp{flex:0 0 auto;width:40px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 0 6px;text-align:center}
.hp .n{display:block;font-size:12px;color:var(--ink2);line-height:1}
.hp .v{display:flex;align-items:center;justify-content:center;height:26px;margin-top:3px}
.hp[aria-current="true"]{background:var(--flag);border-color:var(--flag)}
.hp.locked{opacity:.4;border-style:dashed}
.hp{position:relative}
.hp.inc::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.stat.falta{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.stat.falta h3::after{content:" · falta";color:var(--red);font-size:15px;font-weight:600}
.hp[aria-current="true"] .n,.hp[aria-current="true"] .mk{color:var(--on-flag)}
.hp[aria-current="true"] .mk.birdie,.hp[aria-current="true"] .mk.eagle,.hp[aria-current="true"] .mk.par{border-color:var(--on-flag)}
.hp[aria-current="true"] .mk.eagle,.hp[aria-current="true"] .mk.double{box-shadow:0 0 0 2px var(--flag),0 0 0 3.5px var(--on-flag)}

/* traditional scorecard notation */
.mk{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;font-family:var(--display);font-weight:600;font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.mk.birdie{position:relative;isolation:isolate;min-width:30px;height:30px;font-size:15px;font-weight:700;padding-top:4px;color:var(--on-gold);border:0}
.mk.birdie::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--gold);clip-path:polygon(50% 0%,61.8% 34.5%,98% 34.5%,68.6% 56.9%,79.4% 91%,50% 70%,20.6% 91%,31.4% 56.9%,2% 34.5%,38.2% 34.5%)}
.hp .mk.birdie{min-width:26px;height:26px;font-size:13px;padding-top:2px}
.hp[aria-current="true"] .mk.birdie{color:var(--flag)}
.hp[aria-current="true"] .mk.birdie::before{background:var(--on-flag)}
.mk.par{border:1.5px solid var(--green);border-radius:50%;color:var(--green)}
.mk.eagle{border:1.5px solid var(--red);border-radius:50%;color:var(--red);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--red)}
.mk.bogey{border:1.5px solid currentColor}
.mk.double{border:1.5px solid currentColor;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px currentColor;color:var(--orange)}
.mk.double.triple{color:var(--red)}
.mk.empty{color:var(--line)}

/* hole header */
.hole{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-bottom:12px}
.hole .big{font-family:var(--display);font-weight:700;font-size:76px;line-height:.85;letter-spacing:-1px}
.hole .big small{display:block;font-size:15px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-bottom:6px}
.hole dl{display:grid;grid-template-columns:repeat(3,auto);gap:2px 16px;margin:0;justify-content:start}
.hole dt{font-size:13px;color:var(--ink2)}
.hole dd{margin:0;font-family:var(--display);font-size:24px;font-weight:600;line-height:1}
.hole .pp{margin-top:8px;font-size:14px;color:var(--ink2)}
.hole .pp b{color:var(--ink)}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.stat > .row h3{font-size:20px}
.stat .hint{font-size:13px;color:var(--ink2);margin-top:2px}
.stat .chips{margin-top:10px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--green);background:transparent;color:var(--green);font-family:var(--display);font-size:30px;line-height:1;font-weight:600}
.stepper output{min-width:56px;text-align:center;font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.stepper.sm button{width:44px;height:44px;font-size:24px}
.stepper.sm output{font-size:30px;min-width:44px}
.stepper output.none{color:var(--line)}
.scoreline{font-size:14px;color:var(--ink2);margin-top:6px;text-align:right}
.scoreline b{color:var(--ink)}
.dist{display:flex;align-items:center;gap:8px;margin-top:10px}
.dist input{width:96px;text-align:center;font-family:var(--display);font-size:28px;font-weight:600;padding:6px 8px}
.dist .u{color:var(--ink2)}
.dist button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
details.more{margin-bottom:10px}
details.more summary{padding:10px 4px;color:var(--green);font-weight:600;cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"− "}
.mini{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}

/* bottom bars */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.dock .in{max-width:528px;margin:0 auto}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{background:none;border:0;padding:6px 2px;border-radius:10px;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--green);font-weight:600;background:var(--green-soft)}
.dict{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.dict input{min-height:48px}
.mic{width:48px;height:48px;border-radius:50%;border:0;background:var(--flag);color:var(--on-flag);display:flex;align-items:center;justify-content:center}
.mic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic.on{background:var(--red);color:var(--on-red);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}}
.dnote{font-size:13px;color:var(--ink2);margin:6px 2px 0;min-height:0}
.dnote button{margin-left:6px}
.nav2{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:10px}

/* scorecard table */
.cardwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px}
table.sc{border-collapse:collapse;width:100%;min-width:320px;font-variant-numeric:tabular-nums}
.sc th,.sc td{padding:6px 1px;text-align:center;font-size:12.5px;border-bottom:1px solid var(--line);min-width:25px}
.sc tr:last-child th,.sc tr:last-child td{border-bottom:0}
.sc th[scope=row]{text-align:left;padding-left:8px;font-weight:500;color:var(--ink2);white-space:nowrap;min-width:54px}
.sc thead th{background:var(--green);color:var(--on-green);font-family:var(--display);font-size:16px;font-weight:600}
.sc thead th[scope=row]{color:var(--on-green)}
.sc td.tot,.sc th.tot{font-weight:600;border-left:1px solid var(--line);min-width:36px;padding-right:4px;font-family:var(--display);font-size:15px}
.sc thead th.tot{border-left-color:transparent}
.sc .mk{min-width:19px;height:19px;font-size:15px}
.sc .mk.birdie{min-width:30px;height:30px;font-size:14px;font-weight:700;padding-top:4px}
.sc .mk.eagle{box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px var(--red)}
.sc .mk.double{box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px currentColor}
.sc .y{color:var(--green);font-weight:600}
.sc .x{color:var(--red);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
.kpi .v{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;font-weight:500;color:var(--ink2);margin-left:2px}
.kpi .k{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.25}
.kpis.two{grid-template-columns:repeat(2,1fr)}
.kpis.four{grid-template-columns:repeat(4,1fr)}
.kpis.four .kpi .v{font-size:28px}

.list{list-style:none;margin:0;padding:0}
.list li + li{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 0}
.item .t{font-weight:600}
.item .s{font-size:14px;color:var(--ink2)}
.item .g{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;text-align:right}
.item .g small{display:block;font-size:14px;font-weight:500;color:var(--ink2)}

.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:baseline;font-size:14px}
.barrow .track{grid-column:1/-1;grid-row:2}
.barrow .track{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.barrow .fill{height:100%;background:var(--green);border-radius:4px}
.barrow .r{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.split{display:flex;height:40px;border-radius:8px;overflow:hidden;margin:8px 0 6px}
.split div{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:18px;min-width:44px}
.split .a{background:var(--surface2);color:var(--ink)}
.split .b{background:var(--green);color:var(--on-green)}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:nowrap}
.tbl thead th{font-weight:500;color:var(--ink2);font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.note{background:var(--green-soft);border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:12px}
.empty{padding:26px 8px;text-align:center;color:var(--ink2)}
.empty h2{color:var(--ink);margin-bottom:6px}

.edit{width:100%;border-collapse:collapse}
.edit th{font-size:13px;font-weight:500;color:var(--ink2);padding:4px 2px;text-align:center}
.edit td{padding:3px 2px;text-align:center}
.edit td:first-child{font-family:var(--display);font-weight:600;font-size:18px;width:34px}
.edit input{padding:6px 4px;min-height:40px;text-align:center}

/* gps */
.gpsbig{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.gpsbig b{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.gpsbig span{color:var(--ink2);font-size:15px}
.gpsacc{font-size:13px;color:var(--ink2);margin-top:2px}
.gpsacc.warn{color:var(--red)}
.gpsbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gpsbtns .btn{padding:10px 8px;font-size:15px}
.shots{list-style:none;margin:10px 0 0;padding:0;font-size:15px}
.shots li{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
.shots li b{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:12px;right:12px;margin:0 auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:15px;max-width:520px;z-index:20;display:none;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.show{display:flex}
#toast.high{bottom:calc(186px + env(safe-area-inset-bottom,0px))}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px 4px;white-space:nowrap}
.sync{font-size:13px;color:var(--ink2);text-align:right;line-height:1.25}
@media (min-width:620px){ #app{padding-top:28px} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

/* ---------- Datos base ---------- */
// Tarjeta del Río Cuarto Golf Club (par 72). Editable desde la pestaña Cancha.
var RCGC = { id:'rcgc', name:'Río Cuarto Golf Club', holes:[
  [1,4,7,435,395],[2,4,13,354,303],[3,4,1,440,383],[4,4,9,378,340],[5,5,3,530,446],[6,3,17,176,155],
  [7,4,15,344,318],[8,3,11,209,188],[9,4,5,410,373],[10,4,2,454,374],[11,3,18,182,150],[12,4,16,352,296],
  [13,4,8,397,333],[14,5,14,487,423],[15,5,4,515,483],[16,3,12,203,153],[17,4,6,400,355],[18,5,10,529,479]
].map(function(a){return {n:a[0],par:a[1],si:a[2],ydH:a[3],ydD:a[4]};}) };

// Casa de Campo, La Romana (RD). Caballeros = salida blanca, Damas = salida roja.
var TOTD = { id:'totd', v:2, name:'Diente de Perro (Casa de Campo)', holes:[
  [1,4,7,332,277],[2,4,13,346,249],[3,5,11,436,374],[4,4,3,344,297],[5,3,15,122,68],[6,4,1,355,333],
  [7,3,17,122,89],[8,4,5,335,287],[9,5,9,514,400],[10,4,8,352,299],[11,5,10,536,469],[12,4,4,357,324],
  [13,3,16,137,89],[14,5,14,454,361],[15,4,12,302,247],[16,3,18,142,84],[17,4,2,330,266],[18,4,6,375,311]
].map(function(a){return {n:a[0],par:a[1],si:a[2],ydH:a[3],ydD:a[4]};}) };

// Iberostar Bávaro, Punta Cana (RD). Caballeros = salida blanca, Damas = salida roja (hoyos 11 a 14 con yardas de la blanca: sin dato confiable).
var IBB = { id:'ibb', v:2, name:'Iberostar Bávaro', holes:[
  [1,4,16,308,250],[2,3,6,170,118],[3,4,12,274,240],[4,4,2,355,327],[5,5,18,448,408],[6,4,4,317,257],
  [7,4,14,290,262],[8,3,10,148,103],[9,5,8,484,417],[10,4,9,323,293],[11,3,3,175,175],[12,4,11,309,309],

}

  var labels={'0':'Sin approach, llegaste al green de lejos','1':'1 golpe de approach','2':'2 golpes de approach','3+':'3 o más'};
  return '<section class="block"><h3>Approach y putter</h3><p class="small muted" style="margin-bottom:10px">Golpes de approach = Cerca menos Putts. En los '+P.n+(P.n===1?' hoyo':' hoyos')+' donde anotaste los dos datos.</p>'+
    '<div class="kpis two"><div class="kpi"><div class="v">'+f1(a)+'</div><div class="k">golpes de approach por hoyo</div></div><div class="kpi"><div class="v">'+f1(P.putts/P.n)+'</div><div class="k">putts por hoyo</div></div></div>'+
    '<p style="margin-top:10px">'+msg+'</p>'+
    '<div class="bars" style="margin-top:12px">'+['0','1','2','3+'].filter(function(k){return P.dist[k];}).map(function(k){ return '<div class="barrow"><span>'+labels[k]+'</span><span class="r">'+P.dist[k]+(P.dist[k]===1?' hoyo':' hoyos')+'</span><div class="track"><div class="fill" style="width:'+Math.round(100*P.dist[k]/P.n)+'%"></div></div></div>'; }).join('')+'</div></section>';
}

function vCompare(rounds){

    return {k:k,n:by[k].length,rel:A.holes?18*A.rel/A.holes:null,sal:A.sal.n?100*A.sal.ok/A.sal.n:null,gd:A.gd.n?A.gd.sum/A.gd.n:null,c:A.c.n?A.c.sum/A.c.n:null,dis:L.holes?18*L.dis/L.holes:null}; });

/* ---------- Handicap y metas ---------- */
function hcpLog(){ var l=(S.profile.hcpLog||[]).slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;}); return l; }
function goals(){ return (S.profile.goals||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;}); }
function dnum(s){ var p=s.split('-'); return Date.UTC(+p[0],+p[1]-1,+p[2])/86400000; }
function hf(v){return v==null?'–':(+v).toLocaleString('es-AR',{maximumFractionDigits:1});}
function curHcp(){ var l=hcpLog(); return l.length?l[l.length-1].v:(S.profile.hcp==null?null:S.profile.hcp); }
function planAt(day){
  var l=hcpLog(), g=goals(); if(!l.length||!g.length) return null;
  var pts=[{d:dnum(l[0].date),v:l[0].v}].concat(g.map(function(x){return {d:dnum(x.date),v:x.v};}));
  if(day<=pts[0].d) return pts[0].v;
  for(var i=1;i<pts.length;i++){ if(day<=pts[i].d){ var a=pts[i-1],b=pts[i]; return a.v+(b.v-a.v)*(day-a.d)/Math.max(1,b.d-a.d); } }
  return pts[pts.length-1].v;
}
function playSignal(){
  var rs=sortedRounds().filter(function(r){return r.status!=='en_curso'&&tipoOf(r)!=='practica'&&totals(r).n>=9;}).slice(0,5);
  if(!rs.length) return null;
  var rel=0,n=0; rs.forEach(function(r){var t=totals(r); rel+=t.rel; n+=t.n;});
  return {n:rs.length,rel18:18*rel/n};
}

    g.forEach(function(x){ var cx=X(dnum(x.date)), cy=Y(x.v); svg+='<path d="M'+cx+' '+(cy-14)+'v14" style="stroke:var(--ink);stroke-width:1.5"/><path d="M'+cx+' '+(cy-14)+'l9 3.5l-9 3.5z" style="fill:var(--flag)"/><text x="'+(cx-4)+'" y="'+(cy+15)+'" text-anchor="end" style="font-size:12px;font-weight:600;fill:var(--ink)">'+hf(x.v)+'</text>'; }); }

  if(l.length>1) svg+='<path d="'+l.map(function(p,i){return (i?'L':'M')+X(dnum(p.date)).toFixed(1)+' '+Y(p.v).toFixed(1);}).join(' ')+'" style="fill:none;stroke:var(--green);stroke-width:2.5;stroke-linejoin:round"/>';
  l.forEach(function(p){ svg+='<circle cx="'+X(dnum(p.date))+'" cy="'+Y(p.v)+'" r="4" style="fill:var(--surface);stroke:var(--green);stroke-width:2.2"/>'; });

function reflTips(r){
  var f=refl(r), tips=[], errs={}; Object.keys(f.holes||{}).forEach(function(n){var e=f.holes[n].err; if(e) errs[e]=(errs[e]||0)+1;});
  if(errs.decision) tips.push({id:'decidir',txt:'En '+errs.decision+(errs.decision===1?' hoyo':' hoyos')+' el problema fue la decisión: practicá "rodar, volar o parar" y jugá al centro del green.'});
  if(errs.apunte) tips.push({id:'mapa',txt:'Apuntaste mal en '+errs.apunte+(errs.apunte===1?' hoyo':' hoyos')+': elegí siempre un punto de bote concreto y sacale la "foto" antes de pegar.'});
  if(errs.ejecucion) tips.push({id:'vuelo',txt:'La ejecución falló en '+errs.ejecucion+(errs.ejecucion===1?' hoyo':' hoyos')+': ahí sí sirve el trabajo técnico, con el control de distancia y el mapa de palos.'});
  var hs=f.holes||{}, angry=0, noRut=0; Object.keys(hs).forEach(function(n){ if(hs[n].tee==='Enfadado'||hs[n].tee==='Tenso') angry++; if(hs[n].rut==='no') noRut++; });
  if(errs.cabeza||(f.ans>=4)) tips.push({id:'nervios',txt:'Los nervios pesaron. No te digas "calmate": ocupá la cabeza con tres preguntas antes de pegar: ¿dónde quiero que caiga?, ¿a qué apunto exactamente?, ¿cómo estoy respirando? Soltá el aire despacio y llegá a la bola con una sola palabra, como "suave".'});
  if(angry) tips.push({id:'tee',txt:'En '+angry+(angry===1?' hoyo complicado llegaste':' hoyos complicados llegaste')+' al tee tenso o enfadado. Los peores hoyos suelen empezar ahí: cerrá cada hoyo en el green con un gesto y una respiración, y arrancá el siguiente de cero.'});
  if(noRut) tips.push({id:'rutina',txt:'En '+noRut+(noRut===1?' hoyo':' hoyos')+' no hiciste tu rutina. Practicala en la cancha: las últimas 5 bolas del calentamiento, con el palo del hoyo 1, como si te estuvieran mirando.'});
  if(f.after==='heroico') tips.push({id:'tren',txt:'Después de un mal hoyo fuiste a recuperarlo todo de una: así empieza el "tren de bogeys". La mejor salida suele ser el golpe aburrido, aceptando el bogey.'});
  if(f.conf&&f.conf<=2) tips.push({id:'conf',txt:'Con poca confianza, elegí el golpe que sabés jugar aunque no sea el más lindo: un chip rodado antes que un flop, un híbrido antes que el driver.'});
  if((f.sens||[]).indexOf('Apurado')>=0||(f.causes||[]).indexOf('Apuro o poco tiempo')>=0) tips.push({id:'apuro',txt:'Jugaste apurado: llegá con tiempo para calentar y hacé la rutina aunque el grupo de atrás espere.'});
  return tips;
}

function pickLesson(r){
  var f=refl(r), hs=f.holes||{}, angry=Object.keys(hs).some(function(n){return hs[n].tee==='Enfadado';})||(f.sens||[]).indexOf('Frustrado')>=0;

  if(f.ans>=4) return LESSONS.nervios;

function weekKey(){ var d=new Date(), t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); var day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); var y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return t.getUTCFullYear()+'-S'+Math.ceil(((t-y)/86400000+1)/7); }

function trainAnalysis(){
  var all=sortedRounds().filter(function(r){return r.status!=='en_curso'&&totals(r).n>0;}), play=all.filter(function(r){return tipoOf(r)!=='practica';}), rs=(play.length?play:all).slice(0,10);
  if(!rs.length) return null;
  var A=aggregate(rs), L=lossSplit(rs), r18=L.holes/18||1, areas=[];
  var salPct=A.sal.n?A.sal.ok/A.sal.n:null;
  var salCost=(A.sal.okN&&A.sal.noN)?(A.sal.noN/r18)*(A.sal.noRel/A.sal.noN-A.sal.okRel/A.sal.okN):(A.sal.n?(A.sal.n-A.sal.ok)/r18*0.7:0);
  areas.push({k:'salida',cost:Math.max(0,salCost),txt:salPct==null?'':'Salidas en juego: '+Math.round(100*salPct)+'% en par 4 y 5.'});
  var disR=L.holes?L.dis/r18:0; areas.push({k:'dis',cost:L.holes?L.disCost/r18:0,txt:'Dobles bogeys o peor: '+f1(disR)+' cada 18 hoyos.'});

  var pAvg=A.putts.n?A.putts.sum/A.putts.n:null, apAvg=A.ap.n?A.ap.sum/A.ap.n:null;

  areas.push({k:'putt',cost:cerCost*puttShare,txt:pAvg==null?'Cargá los putts para separar putter de approach.':'Putts por hoyo: '+f1(pAvg)+'.'});
  areas.push({k:'corto',cost:cerCost*(1-puttShare),txt:cAvg==null?'':'Golpes de cerca por hoyo: '+f1(cAvg)+(c2!=null?' ('+Math.round(100*c2)+'% en 2 o menos)':'')+(apAvg!=null?'; approach: '+f1(apAvg)+' por hoyo':'')+'.'});
  areas.sort(function(a,b){return b.cost-a.cost;});

function weekPlan(an){

function saveFile(name,text,type){

  a.href=u; a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },1500);

// Suma los datos de otra copia: gana la versión más reciente de cada vuelta y del perfil.
function importData(d){
  if(!d||!d.profile||!Array.isArray(d.profile.courses)||typeof d.rounds!=='object') return -1;
  var n=0, del={}; (S.profile.deleted||[]).concat(d.profile.deleted||[]).forEach(function(x){del[x]=1;});
  var fresh=!Object.keys(S.rounds).length, oldP=S.profile;
  if(fresh||(d.profile.updatedAt||0)>=(S.profile.updatedAt||0)){ var lb=oldP.lastBackup; S.profile=clone(d.profile); if(lb&&!S.profile.lastBackup) S.profile.lastBackup=lb; }
  // No perder greens marcados con GPS en ninguna de las dos copias.
  [oldP,d.profile].forEach(function(src){ (src.courses||[]).forEach(function(c){ var me=courseById(c.id); if(!me) return;
    (c.holes||[]).forEach(function(h){ if(!h.green) return; var mh=me.holes.filter(function(x){return x.n===h.n;})[0]; if(mh&&!mh.green) mh.green=h.green; }); }); });
  S.profile.deleted=Object.keys(del).slice(-300);
  Object.keys(d.rounds).forEach(function(id){ var r=d.rounds[id]; if(!r||del[id]) return; var loc=S.rounds[id];
    if(!loc||(r.updatedAt||0)>=(loc.updatedAt||0)){ S.rounds[id]=r; n++; } });
  ensureBuiltins(); saveLocal(); UI.view='home'; render(); return n;
}
function b64urlToBytes(t){ t=t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; var bin=atob(t), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
// Link de mudanza desde la versión de claude.ai: #importar=<datos comprimidos>
function importFromHash(){
  var m=location.hash.match(/^#importar=([A-Za-z0-9_-]+)$/); if(!m) return;
  history.replaceState(null,'',location.pathname+location.search);
  if(typeof DecompressionStream!=='function'){ toast('Actualizá el navegador para traer tus vueltas'); return; }
  var st=new Blob([b64urlToBytes(m[1])]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  new Response(st).text().then(function(t){ var n=importData(JSON.parse(t)); toast(n<0?'No pude leer tus vueltas':'Listo: trajiste '+n+(n===1?' vuelta':' vueltas')); })
    .catch(function(){ toast('No pude leer tus vueltas'); });
}

var G={on:false,watch:null,pos:null,err:null};
function hav(a,b){ var R=6371000,toR=Math.PI/180,dLa=(b.lat-a.lat)*toR,dLo=(b.lng-a.lng)*toR,x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLo/2)*Math.sin(dLo/2); return Math.round(2*R*Math.asin(Math.sqrt(x))); }

function greenOf(r,n){ var h=courseHole(r,n); return h&&h.green?h.green:null; }
function gpsStart(){

  try{
    G.on=true;
    G.watch=navigator.geolocation.watchPosition(function(p){ G.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0),t:Date.now()}; paintGps(); },
      function(e){ if(e&&e.code===1){ G.err='El celular no le da tu ubicación a la app. Habilitá la ubicación para este sitio en el navegador (en Safari: aA › Configuración del sitio web › Ubicación) y volvé a tocar Activar.'; gpsStop(); render(); return; }
        var aEl=document.getElementById('gpsAcc'); if(aEl&&!G.pos){ aEl.textContent='Sin señal por ahora. Seguí al aire libre unos segundos.'; aEl.className='gpsacc warn'; } },
      {enableHighAccuracy:true,maximumAge:3000,timeout:30000});
  }catch(e){ G.err='Este navegador no da la ubicación.'; G.on=false; }
  clearTimeout(G.slow); G.slow=setTimeout(function(){ if(G.on&&!G.pos){ var aEl=document.getElementById('gpsAcc'); if(aEl){ aEl.textContent='Todavía sin ubicación. Revisá que la ubicación del celular esté prendida y que el navegador tenga permiso.'; aEl.className='gpsacc warn'; } } },12000);

function step(el,dir){
  keepDict(); var r=curRound(); if(!r) return; var f=el.dataset.f, n=UI.hole, h=r.holes.filter(function(x){return x.n===n;})[0];
  var m=document.getElementById('more'); if(m) UI.more=m.open;
  if(f==='o'){ var pid=el.dataset.pid; r.others=r.others||{}; var o=r.others[pid]||(r.others[pid]={}); var cur=o[n];
    var v=cur==null?(dir>0?h.par:h.par-1):cur+dir; if(v<1) delete o[n]; else o[n]=Math.min(20,v); touch(r); render(); return; }
  var d=r.scores[n]||{}, c=d[f], nv;
  if(f==='s'){ nv=c==null?(dir>0?h.par:h.par-1):c+dir; if(nv<1) nv=null; else nv=Math.min(20,nv); }
  else if(f==='c'){ nv=c==null?(dir>0?2:0):c+dir; if(nv<0) nv=null; else nv=Math.min(15,nv); }
  else if(f==='pc'){ UI.more=true; nv=c==null?(dir>0?1:0):c+dir; if(nv<0) nv=null; else nv=Math.min(10,nv); }
  else { if(f==='pen') UI.more=true; nv=c==null?(dir>0?(f==='p'?2:1):0):c+dir; if(nv<0) nv=null; else nv=Math.min(f==='p'?10:9,nv); }
  var patch={}; patch[f]=nv; setHole(r,n,patch);
}
